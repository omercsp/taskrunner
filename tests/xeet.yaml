variables:
  base_cmd: task run

settings:
  xeet:
    default_step_type: exec
  exec_step:
    use_os_env: true
  common_steps:
    base_exec:
      type: exec
      cwd: '{XEET_ROOT}'
      use_os_env: true
      output_behavior: split
      stdout_file: ../stdout
      stderr_file: ../stderr
      expected_stdout_file: '{XEET_ROOT}/xeet.expected/{XEET_TEST_NAME}/stdout'
      expected_stderr_file: '{XEET_ROOT}/xeet.expected/{XEET_TEST_NAME}/stderr'

tests:
  - name: test_base
    abstract: true
    variables:
      test_cmd: '{base_cmd} {XEET_TEST_NAME}'
    run:
      - base: settings.common_steps.base_exec
        cmd: '{test_cmd}'

  - name: test_base_rc1
    base: test_base
    abstract: true
    run:
      - base: settings.common_steps.base_exec
        cmd: '{test_cmd}'
        allowed_rc: [1]

  - name: test_base_rc255
    base: test_base
    abstract: true
    run:
      - base: settings.common_steps.base_exec
        cmd: '{test_cmd}'
        allowed_rc: [255]

  - name: 001a_simple
    base: test_base

  - name: 001b_simple
    base: test_base

  - name: 002a_simple_env
    base: test_base

  - name: 002b_simple_env
    base: test_base

  - name: 002c_env_inherit
    base: test_base

  - name: 002d_no_env_inherit
    base: test_base_rc1

  - name: 003a_stop_on_error
    base: test_base_rc1

  - name: 003b_continue_on_error
    base: test_base_rc1

  - name: 004a_bash_multi_cmds_no_fail
    base: test_base_rc1

  - name: 004b_bash_multi_cmds_allow_fail
    base: test_base

  - name: 010_list_tasks
    base: test_base

  - name: 015a_os_env_inherit
    base: test_base
    run:
      - base: settings.common_steps.base_exec
        cmd: '{test_cmd}'
        env:
          ext_var: ext_var_value

  - name: 015b_no_os_env_inherit
    base: 015a_os_env_inherit
    run:
      - base: settings.common_steps.base_exec
        cmd: '{test_cmd}'
        env:
          ext_var: ext_var_value
        allowed_rc: [1]

  - name: 020a_workdir_root
    base: test_base

  - name: 020b_workdir_opt
    base: test_base

  - name: 020c_workdir_taskroot
    base: test_base

  - name: 023_var_expansion
    base: test_base

  - name: 024_var_expansion_env
    base: test_base

  - name: 025_env_whitespace
    base: test_base

  - name: 030_args_handling
    base: test_base
    variables:
      test_cmd: '{base_cmd} {XEET_TEST_NAME} -- If I had wings...'

  - name: 031_args_override
    base: test_base
    variables:
      test_cmd: '{base_cmd} {XEET_TEST_NAME} --env MY_ENV0=new_value --shell=yes --cwd /opt -c "pwd; echo $MY_ENV0"'

  - name: 032_args_var_override
    base: test_base
    variables:
      test_cmd: '{base_cmd} {XEET_TEST_NAME} -V var0=new_var0'

  - name: 033a_task_vars
    base: test_base
    groups: [vars]

  - name: 033b_task_vars
    base: test_base
    groups: [vars]

  - name: 033c_task_vars_no_inherit
    base: test_base
    groups: [vars]

  - name: 040_config_file_include_defs
    base: test_base

  - name: 041_included
    base: test_base

  - name: 042_included
    base: test_base

  - name: 043a_cmds_override
    base: test_base
    groups: [cmds_inherit]

  - name: 043b_cmds_inherit_before
    base: test_base
    groups: [cmds_inherit]

  - name: 043c_cmds_inherit_after
    base: test_base
    groups: [cmds_inherit]

  - name: 043d_cmds_inherit_ignore
    base: test_base
    groups: [cmds_inherit]

  - name: 043e_cmds_inherit_depth_2
    base: test_base
    groups: [cmds_inherit]

  - name: 050a_container_ubuntu
    base: test_base
    groups: [container]

  - name: 050b_container_rocky
    base: test_base
    groups: [container]

  - name: 051_container_no_inherit
    base: test_base
    groups: [container]

  - name: 060_info
    base: test_base

  - name: 061_dump
    base: test_base

  - name: 080_recursive_fail
    base: test_base_rc255
